[build-system]
requires = ["setuptools>=82", "wheel>=0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "parrot-backend"
version = "0.2.0"
description = "Multi-tenant Parrot platform backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.30,<1",
  "croniter>=6,<7",
  "cryptography>=49,<50",
  "fastapi>=0.136,<0.137",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "mcp>=1.27,<2",
  "pillow>=11,<12",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "pymilvus>=2.6,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.20,<1",
  "qiniu>=7.18,<8",
  "redis>=5,<8",
  "sqlalchemy[asyncio]>=2.0.49,<2.1",
  "sympy>=1.14,<2",
  "typer>=0.21,<1",
  "uvicorn[standard]>=0.47,<0.48",
  "taskiq>=0.12,<0.13",
  "taskiq-redis>=1.2,<1.3",
  "openpyxl>=3.1,<4",
  "pypdfium2>=4,<5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.9,<3",
  "pyright>=1.1.409,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
parrot = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/cli.py" = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "tests", "alembic/env.py"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Application layers point inward"
type = "layers"
layers = [
  "app.api",
  "app.modules",
  "app.infrastructure",
  "app.core",
]
