[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-api-echo-demo"
version = "0.1.0"
description = "Stateless local MCP and HTTP service for integration testing"
requires-python = ">=3.13"
dependencies = [
  "mcp>=1.27,<2",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.47,<0.48",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.409,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<0.16",
]

[project.scripts]
mcp-api-echo-demo = "mcp_api_echo_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
